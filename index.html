<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">ORBIT</a>
    <nav>
      <a href="#produtos">Produtos</a>
      <a href="carrinho.html">Carrinho (<span id="contador">0</span>)</a>
    </nav>
  </header>

  <div class="hero">
    <h1>Loja<br>Orbit</h1>
    <p>Componentes eletrônicos</p>
    <div><a href="#produtos" class="btn">Ver produtos</a></div>
  </div>

  <section class="produtos" id="produtos">
    <h2>Produtos</h2>
    <div class="grade" id="grade"></div>
  </section>

  <script src="js/produtos.js"></script>
  <script src="js/carrinho-store.js"></script>
  <script>
    const grade = document.getElementById("grade");
    const contador = document.getElementById("contador");

    //cards 
    grade.innerHTML = PRODUTOS.map((p) => `
      <article class="card">
        <div class="img-container">
            <img src="${p.imagem}" alt="${p.nome}" class="produto-img">
        </div>
        <small>${p.categoria}</small>
        <h3>${p.nome}</h3>
        <div class="preco">${formatarBRL(p.preco)}</div>
        <button class="btn" data-id="${p.id}">Adicionar ao carrinho</button>
      </article>`).join("");

    const atualizarContador = () => (contador.textContent = Carrinho.totalItens());

    
    grade.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-id]");
      if (!btn) return;
      Carrinho.adicionar(PRODUTOS.find((p) => p.id === Number(btn.dataset.id)));
      atualizarContador();
      
      btn.textContent = "Adicionado ✓";
      btn.classList.add("ok");
      setTimeout(() => { btn.textContent = "Adicionar ao carrinho"; btn.classList.remove("ok"); }, 900);
    });

    atualizarContador();
  </script>
</body>
</html>
